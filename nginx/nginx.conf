server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use docker's embedded DNS so upstream hostnames (flowdesk-api) re-resolve
    # on a TTL — without this, nginx caches the api container's IP forever and
    # `docker compose up --build api` rotates that IP, producing 502s until
    # nginx is also restarted. Variable-based proxy_pass forces nginx to use
    # the resolver instead of resolving at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── SSE event stream ─────────────────────────────────────
    # Must come BEFORE the generic /api/ block so it matches first.
    # Long-lived connection; nginx must not buffer or it'll never
    # deliver events.
    location /api/events/ {
        set $api_upstream http://flowdesk-api:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         $api_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ── API proxy ─────────────────────────────────────────────
    location /api/ {
        set $api_upstream http://flowdesk-api:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         $api_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # NOTE: /media, /docs, and /openapi.json are intentionally NOT proxied to the
    # public. Media is served only via authenticated API routes, and the docs are
    # disabled in production (main.py gates them on ENVIRONMENT). Exposing either
    # would leak documents/signatures or a full endpoint map.

    # ── Frontend SPA ──────────────────────────────────────────
    location / {
        # Security headers on the HTML response. CSP is the main mitigation for
        # the token being stored in localStorage — it blocks injected/inline and
        # cross-origin scripts. Loosen only if the app legitimately needs it.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # HSTS only takes effect over HTTPS; harmless (ignored) over plain HTTP.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # ── Caching for static assets ─────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
