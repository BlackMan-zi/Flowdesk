server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use docker's embedded DNS so upstream hostnames (flowdesk-api) re-resolve
    # on a TTL — without this, nginx caches the api container's IP forever and
    # `docker compose up --build api` rotates that IP, producing 502s until
    # nginx is also restarted. Variable-based proxy_pass forces nginx to use
    # the resolver instead of resolving at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── SSE event stream ─────────────────────────────────────
    # Must come BEFORE the generic /api/ block so it matches first.
    # Long-lived connection; nginx must not buffer or it'll never
    # deliver events.
    location /api/events/ {
        set $api_upstream http://flowdesk-api:8000;
        proxy_pass         $api_upstream/events/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ── API proxy ─────────────────────────────────────────────
    # Frontend calls /api/auth/login → strip /api → backend gets /auth/login
    location /api/ {
        set $api_upstream http://flowdesk-api:8000;
        proxy_pass         $api_upstream/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # ── Media files ───────────────────────────────────────────
    # PDF templates, attachments, signatures, generated documents
    location /media/ {
        set $api_upstream http://flowdesk-api:8000;
        proxy_pass         $api_upstream/media/;
        proxy_set_header   Host $host;
    }

    # ── Swagger docs (optional, dev/staging only) ─────────────
    location /docs {
        set $api_upstream http://flowdesk-api:8000;
        proxy_pass         $api_upstream/docs;
        proxy_set_header   Host $host;
    }
    location /openapi.json {
        set $api_upstream http://flowdesk-api:8000;
        proxy_pass         $api_upstream/openapi.json;
        proxy_set_header   Host $host;
    }

    # ── Frontend SPA ──────────────────────────────────────────
    # All other routes serve index.html (React Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caching for static assets ─────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── ES module worker files (.mjs) ──────────────────────────
    # nginx default mime.types omits .mjs; browsers reject module
    # workers served as application/octet-stream
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
