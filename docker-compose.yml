services:

  # ── PostgreSQL Database ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: flowdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - flowdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend (root app) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowdesk-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - flowdesk_media:/app/media

  # ── Nginx + built React frontend ────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: flowdesk-nginx
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

volumes:
  flowdesk_pgdata:
  flowdesk_media:

networks:
  default:
    name: bsc_network
    external: true
